# Example reverse proxy: terminates TLS, proxies the HTTP API and (if
# enabled) the OCPP WebSocket listener to their respective local ports.
# Real chargers generally require wss:// (TLS), not plain ws://, so
# terminating TLS here rather than trying to add it in the app is the
# simplest path to a real OCPP deployment.

server {
    listen 443 ssl http2;
    server_name api.yourdomain.example;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.example/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Separate subdomain for the OCPP WebSocket endpoint, e.g.
# wss://ocpp.yourdomain.example/CP_001
server {
    listen 443 ssl http2;
    server_name ocpp.yourdomain.example;

    ssl_certificate     /etc/letsencrypt/live/ocpp.yourdomain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ocpp.yourdomain.example/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # OCPP connections are long-lived
    }
}
